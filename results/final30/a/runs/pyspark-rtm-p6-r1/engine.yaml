# PySpark RTM SparkApplication — Python driver, native trigger(realTime=...) (Spark >= 4.2),
# out_ts via reflect() (no executor Python). type: Python.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: rtm-bench
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/rtm-bench/spark:v43"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/rtm_pyspark_native.py"
  sparkVersion: "4.3.0"
  sparkConf:
    spark.sql.adaptive.enabled: "false"
    spark.sql.shuffle.partitions: "6"
    spark.hadoop.fs.s3a.aws.credentials.provider: "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 5
    onFailureRetryInterval: 5
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 5
  # Pod-total memory set to EXACTLY match Flink's JM/TM pods (see spark-rtm.yaml).
  driver:
    nodeSelector: { bench/role: engine }
    tolerations: [{ key: bench/role, operator: Equal, value: engine, effect: NoSchedule }]
    cores: 1
    memory: "1536m"
    memoryOverhead: "512m"     # 2048m pod, = Flink JobManager
    serviceAccount: spark-operator-spark
    env:
      - { name: KAFKA_BOOTSTRAP_INTERNAL, value: "bench-kafka-bootstrap.kafka.svc:9092" }
      - { name: INPUT_TOPIC, value: "input-events" }
      - { name: OUTPUT_TOPIC, value: "output-events" }
      - { name: RTM_TRIGGER, value: "60 seconds" }
      - { name: CHECKPOINT_LOCATION, value: "s3a://<BUCKET>/pyspark-rtm-p6-43b-1794498389" }
  executor:
    nodeSelector: { bench/role: engine }
    tolerations: [{ key: bench/role, operator: Equal, value: engine, effect: NoSchedule }]
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: { matchLabels: { spark-role: executor } }
            topologyKey: kubernetes.io/hostname
    instances: 2
    cores: 3
    memory: "5120m"
    memoryOverhead: "1024m"    # 6144m pod, = Flink TaskManager
