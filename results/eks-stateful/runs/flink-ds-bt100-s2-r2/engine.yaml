# Stateful Flink DataStream job (bench.StatefulDataStream) as a FlinkDeployment, p6 sizing
# identical to eks/jobs/p6/flink-datastream.yaml: JM 1c / 2048m, 2 TMs x 3c / 6144m, 3 slots each.
# State backend (RocksDB, incremental, EXACTLY_ONCE checkpoint mode) is set by the job itself so
# local and EKS runs share one source of truth; the checkpoint dir is passed as an argument.
#
# Placeholders: __ACCOUNT__.dkr.ecr.us-east-1.amazonaws.com v43s __ACCOUNT__ s2 (s1-window|s1-update|s2|s3)
#   AT_LEAST_ONCE (AT_LEAST_ONCE|EXACTLY_ONCE) flink-ds-bt100-s2-r2-1794187194 60000 5
#   10 5000 100 (0 = per-record flush, latency-tuned;
#   100 = Flink's default, arm flink-ds-bt100)
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-stateful
  namespace: flink
  labels: { bench: stateful }
spec:
  image: "__ACCOUNT__.dkr.ecr.us-east-1.amazonaws.com/rtm-bench/flink:v43s"
  imagePullPolicy: Always
  flinkVersion: v2_3
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"
    execution.buffer-timeout: "100 ms"   # job arg 13 sets the same value
    restart-strategy.type: "fixed-delay"
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "2 s"
  serviceAccount: flink
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-presto-2.3.0.jar"
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
  taskManager:
    replicas: 2
    resource:
      memory: "6144m"
      cpu: 3
  job:
    jarURI: "local:///opt/flink/usrlib/flink-stateless.jar"
    entryClass: "bench.StatefulDataStream"
    args:
      - "s2"
      - "bench-kafka-bootstrap.kafka.svc:9092"
      - "st-input"
      - "st-output"
      - "6"
      - "60000"
      - "s3://rtm-flink-bench-ckpt-__ACCOUNT__/stateful/flink-ds-bt100-s2-r2-1794187194"
      - "AT_LEAST_ONCE"
      - "latest"
      - "5"
      - "10"
      - "5000"
      - "5000"
      - "100"
    parallelism: 6
    upgradeMode: stateless
