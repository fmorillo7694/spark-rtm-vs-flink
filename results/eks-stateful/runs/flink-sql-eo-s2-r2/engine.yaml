# Stateful Flink SQL job (bench.StatefulSql: s1 TUMBLE TVF | s2 ROW_NUMBER dedup) as a
# FlinkDeployment, same p6 sizing as flink-stateful-datastream.yaml.
#
# Placeholders: __ACCOUNT__.dkr.ecr.us-east-1.amazonaws.com v43s __ACCOUNT__ s2 (s1|s2)
#   exactly-once (at-least-once|exactly-once) flink-sql-eo-s2-r2-1794202483 60000 5 10
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-stateful
  namespace: flink
  labels: { bench: stateful }
spec:
  image: "__ACCOUNT__.dkr.ecr.us-east-1.amazonaws.com/rtm-bench/flink:v43s"
  imagePullPolicy: Always
  flinkVersion: v2_3
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"
    execution.buffer-timeout: "0 ms"   # job arg 11 sets the same value (0 tuned, 100 Flink default)
    restart-strategy.type: "fixed-delay"
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "2 s"
  serviceAccount: flink
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-presto-2.3.0.jar"
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
  taskManager:
    replicas: 2
    resource:
      memory: "6144m"
      cpu: 3
  job:
    jarURI: "local:///opt/flink/usrlib/flink-sql.jar"
    entryClass: "bench.StatefulSql"
    args:
      - "s2"
      - "bench-kafka-bootstrap.kafka.svc:9092"
      - "st-input"
      - "st-output"
      - "6"
      - "60000"
      - "s3://rtm-flink-bench-ckpt-__ACCOUNT__/stateful/flink-sql-eo-s2-r2-1794202483"
      - "exactly-once"
      - "latest"
      - "5"
      - "10"
      - "0"
    parallelism: 6
    upgradeMode: stateless
