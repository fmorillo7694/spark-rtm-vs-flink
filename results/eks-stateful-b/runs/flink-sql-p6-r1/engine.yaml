# Flink SQL (Table API) job as a FlinkDeployment (application mode), parallelism 6 to match
# input partitions. Schema-based json format + keyed-by-user_id output, so the JSON path and
# partitioning match Spark RTM. Equal resources to every other engine (7c/14GB).
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-bench
  namespace: flink
spec:
  image: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/rtm-bench/flink:v43"
  imagePullPolicy: Always
  flinkVersion: v2_3
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"
    execution.buffer-timeout: "0 ms"
    state.backend.type: "hashmap"
    execution.checkpointing.interval: "60 s"
    execution.checkpointing.mode: "AT_LEAST_ONCE"
    state.checkpoints.dir: "s3://<BUCKET>/flink-sql-p6-43b-1794249786"
    restart-strategy.type: "fixed-delay"
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "2 s"
  serviceAccount: flink
  podTemplate:
    spec:
      tolerations: [{ key: bench/role, operator: Equal, value: engine, effect: NoSchedule }]
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-presto-2.3.0.jar"
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
  taskManager:
    replicas: 2        # 2 TMs x 3 slots = 6 slots for parallelism 6
    resource:
      memory: "6144m"
      cpu: 3
  job:
    jarURI: "local:///opt/flink/usrlib/flink-sql.jar"
    entryClass: "bench.SqlPipeline"
    args:
      - "bench-kafka-bootstrap.kafka.svc:9092"
      - "input-events"
      - "output-events"
      - "6"
    parallelism: 6
    upgradeMode: stateless
