# Flink Java DataStream job as a FlinkDeployment (application mode), parallelism 12 to
# match input partitions. Replace <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/v43 via envsubst in the run script.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-bench
  namespace: flink
spec:
  image: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/rtm-bench/flink:v43"
  imagePullPolicy: Always
  flinkVersion: v2_3
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"
    execution.buffer-timeout: "0 ms"
    state.backend.type: "hashmap"
    # Fault tolerance: periodic checkpoints to durable S3 + auto restart on TM loss.
    execution.checkpointing.interval: "60 s"
    execution.checkpointing.mode: "AT_LEAST_ONCE"
    state.checkpoints.dir: "s3://<BUCKET>/flink-java-p6-43b-1794253461"
    restart-strategy.type: "fixed-delay"
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "2 s"
  serviceAccount: flink
  # Activate the bundled S3 filesystem plugin (present in /opt/flink/opt but off by default).
  podTemplate:
    spec:
      tolerations: [{ key: bench/role, operator: Equal, value: engine, effect: NoSchedule }]
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-presto-2.3.0.jar"
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
  taskManager:
    replicas: 2        # 2 TMs x 3 slots = 6 slots for parallelism 6
    resource:
      memory: "6144m"
      cpu: 3
  job:
    jarURI: "local:///opt/flink/usrlib/flink-stateless.jar"
    entryClass: "bench.StatelessPipeline"
    args:
      - "bench-kafka-bootstrap.kafka.svc:9092"
      - "input-events"
      - "output-events"
      - "6"
    parallelism: 6
    upgradeMode: stateless
