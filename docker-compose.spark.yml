# Spark 4.3.0 standalone cluster: 1 master + 1 worker (6 cores), matched 1:1 to Flink's
# single TaskManager (6 slots) for a 6-partition stateless input. Parallelism 6 on both
# engines; one core/slot per partition. Worker memory is capped to 3072m total to equal
# Flink's taskmanager.memory.process.size (see submit-rtm.sh for the heap+overhead split).
# JupyterLab is the driver host used by the PySpark py4j RTM demo.
#
# Brought up alongside docker-compose.kafka.yml (shared `spark-flink-bench` network).
name: spark-flink

networks:
  bench:
    name: spark-flink-bench
    external: true

services:
  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:4.3.0-scala2.13-java17-ubuntu}
    container_name: spark-master
    hostname: spark-master
    networks: [bench]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # master web UI
      - "7077:7077"   # cluster submit endpoint
    volumes:
      - ./spark:/workspace/spark:ro
      - ./results:/workspace/results
      - spark-ivy:/opt/spark/.ivy2
      - spark-ckpt:/tmp/spark-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Single worker, 6 cores, 3072m total — matched 1:1 to Flink's single 6-slot TaskManager.
  # SPARK_WORKER_CORES=12 for the STATEFUL runs: an RTM stateful query runs its 6 source tasks
  # and 6 state tasks concurrently (pipelined shuffle), so it needs 12 task slots. These are
  # Spark scheduler slots, not CPUs: no container is CPU-limited, and Flink runs the same two
  # operators per slot (slot sharing) in its 6 slots. See STATEFUL_CONFIG.md.
  spark-worker-1:
    image: ${SPARK_IMAGE:-apache/spark:4.3.0-scala2.13-java17-ubuntu}
    container_name: spark-worker-1
    hostname: spark-worker-1
    networks: [bench]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores ${SPARK_WORKER_CORES:-6} --memory 3072m --webui-port 8081
    volumes:
      - ./spark:/workspace/spark:ro
      - ./results:/workspace/results
      - spark-ivy:/opt/spark/.ivy2
      - spark-ckpt:/tmp/spark-checkpoints

  # Driver host for the PySpark py4j RTM demo. Built-in PySpark matches the cluster.
  jupyter:
    image: ${SPARK_IMAGE:-apache/spark:4.3.0-scala2.13-java17-ubuntu}
    container_name: spark-jupyter
    hostname: spark-jupyter
    networks: [bench]
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_INTERNAL: ${KAFKA_BOOTSTRAP_INTERNAL:-kafka:9092}
      SPARK_MASTER_URL: spark://spark-master:7077
    command: ["sleep", "infinity"]
    ports:
      - "8888:8888"
    volumes:
      - ./spark:/workspace/spark
      - ./results:/workspace/results
      - spark-ivy:/opt/spark/.ivy2
      - spark-ckpt:/tmp/spark-checkpoints

volumes:
  spark-ivy:
  spark-ckpt:
