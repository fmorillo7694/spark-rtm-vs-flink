# eksctl manifest — production-grade EKS cluster for the RTM-vs-Flink benchmark.
# Security baseline: KMS secrets envelope encryption, OIDC for IRSA, private+public
# endpoint, managed node group on private subnets, IMDSv2 required. Sized for a 100k+
# evt/s run with Spark + Flink + Strimzi.
# REPLACE the <YOUR_*> placeholders before running (see eks/01_create_cluster.sh header).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: rtm-flink-bench4
  region: us-east-1
  version: "1.36"
  tags:
    project: spark-rtm-vs-flink
    owner: fmorillo
    lifecycle: ephemeral-benchmark
    teardown: "yes"

# IAM OIDC provider so operators (Spark/Flink/Strimzi) can use IRSA.
iam:
  withOIDC: true

# @secure_recommendation: KMS envelope encryption for Kubernetes secrets (ARCC eks baseline)
secretsEncryption:
  # Dedicated us-east-1 CMK created by eks/01_create_cluster.sh (reused CMK, alias rtm-flink-bench3-secrets).
  keyARN: "arn:aws:kms:us-east-1:<YOUR_ACCOUNT_ID>:key/<YOUR_KMS_KEY_ID>"

# Control-plane logging to CloudWatch (audit/authenticator) — observability + ARCC.
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

# @secure_recommendation: reuse the existing benchmark VPC's subnets so we create NO new
# VPC and NO new EIP/NAT (account is at both limits). Nodes land on the private subnets
# (existing NAT for egress); control-plane ENIs span public+private. Public endpoint kept
# ON only so this session's kubectl can reach the API; destroyed at teardown.
vpc:
  id: <YOUR_VPC_ID>
  subnets:
    public:
      us-east-1d: { id: <YOUR_PUBLIC_SUBNET_AZ1> }
      us-east-1f: { id: <YOUR_PUBLIC_SUBNET_AZ2> }
    private:
      us-east-1d: { id: <YOUR_PRIVATE_SUBNET_AZ1> }
      us-east-1f: { id: <YOUR_PRIVATE_SUBNET_AZ2> }
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# 6x m5.2xlarge as before, split 4 + 2: the 2 engine nodes are tainted so only Spark/Flink
# engine pods (which carry the toleration, added by eks/stateful/run_matrix_incluster.sh)
# land there; Kafka brokers, producers, the consumer, operators and the runner stay on bench-ng.
managedNodeGroups:
  - name: engine-ng
    instanceType: m5.2xlarge        # one engine worker per node (+ driver/JM on one of them)
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 100
    volumeType: gp3
    volumeEncrypted: true           # @secure_recommendation: encrypted EBS (ARCC ec2 baseline)
    privateNetworking: true         # @secure_recommendation: nodes in private subnets
    disableIMDSv1: true             # @secure_recommendation: IMDSv2 required (ARCC ec2 baseline)
    # 30-min runs: kubelet rotates container logs at 10Mi by default, and `kubectl logs` then
    # returns only the newest file. AL2023 kubelet merges drop-ins from config.json.d; eksctl has
    # no kubeletExtraConfig for managed nodegroups.
    preBootstrapCommands:
      - |
        mkdir -p /etc/kubernetes/kubelet/config.json.d
        cat > /etc/kubernetes/kubelet/config.json.d/90-container-log-size.conf <<'EOF'
        {"apiVersion": "kubelet.config.k8s.io/v1beta1", "kind": "KubeletConfiguration", "containerLogMaxSize": "200Mi"}
        EOF
    labels:
      workload: bench
      bench/role: engine
    taints:
      - { key: bench/role, value: engine, effect: NoSchedule }
    tags:
      project: spark-rtm-vs-flink
      lifecycle: ephemeral-benchmark
    iam:
      withAddonPolicies:
        ebs: true
        cloudWatch: true
  - name: bench-ng
    instanceType: m5.2xlarge        # 8 vCPU / 32 GiB
    desiredCapacity: 4              # Kafka x3, 8 producers, consumer, operators, runner
    minSize: 4
    maxSize: 6
    volumeSize: 100
    volumeType: gp3
    volumeEncrypted: true           # @secure_recommendation: encrypted EBS (ARCC ec2 baseline)
    privateNetworking: true         # @secure_recommendation: nodes in private subnets
    disableIMDSv1: true             # @secure_recommendation: IMDSv2 required (ARCC ec2 baseline)
    # 30-min runs: kubelet rotates container logs at 10Mi by default, and `kubectl logs` then
    # returns only the newest file. AL2023 kubelet merges drop-ins from config.json.d; eksctl has
    # no kubeletExtraConfig for managed nodegroups.
    preBootstrapCommands:
      - |
        mkdir -p /etc/kubernetes/kubelet/config.json.d
        cat > /etc/kubernetes/kubelet/config.json.d/90-container-log-size.conf <<'EOF'
        {"apiVersion": "kubelet.config.k8s.io/v1beta1", "kind": "KubeletConfiguration", "containerLogMaxSize": "200Mi"}
        EOF
    labels:
      workload: bench
    tags:
      project: spark-rtm-vs-flink
      lifecycle: ephemeral-benchmark
    iam:
      withAddonPolicies:
        ebs: true                   # for EBS CSI dynamic volumes (Kafka/checkpoints)
        cloudWatch: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver        # dynamic gp3 PVCs for Strimzi brokers
  - name: metrics-server            # kubectl top (pod CPU/mem sampling)
